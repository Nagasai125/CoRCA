[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corca"
version = "0.1.0"
description = "Concurrent root-cause analysis for microservice telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "networkx>=3.2,<3.4",
    "causal-learn>=0.1.4,<0.2",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
corca-run = "scripts.run_eval:main"
corca-summarize = "scripts.summarize:main"
corca-demo = "scripts.demo_synthetic:main"

[tool.setuptools.packages.find]
include = ["corca*", "scripts*"]
