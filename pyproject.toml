[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corca"
version = "0.2.0"
description = "Concurrent root-cause analysis for microservice telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "networkx>=3.2,<3.4",
    "causal-learn>=0.1.4,<0.2",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]  # httpx: FastAPI TestClient
server = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[project.scripts]
corca-serve = "backend.api:main"
corca-admin = "backend.admin:main"

[tool.setuptools.packages.find]
include = ["corca", "backend", "frontend", "frontend.fonts"]

[tool.setuptools.package-data]
frontend = ["*.html", "*.json", "*.js", "*.css", "fonts/*.woff", "fonts/*-OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
