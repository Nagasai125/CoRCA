services:
  corca:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: corca:0.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORCA_DB: /var/lib/corca/corca.db
      CORCA_REQUIRE_ACCOUNTS: ${CORCA_REQUIRE_ACCOUNTS:-0}
      CORCA_ALLOWED_SOURCE_HOSTS: ${CORCA_ALLOWED_SOURCE_HOSTS:-}
      CORCA_MAX_PENDING: ${CORCA_MAX_PENDING:-100}
    volumes:
      - corca-data:/var/lib/corca
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  corca-data:
